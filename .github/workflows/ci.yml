name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system tools
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full zip jpegoptim pngquant optipng gzip xz-utils bzip2 zstd brotli qpdf

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,fits,blend]"

    - name: Run tests
      run: |
        pytest --cov=filerepack --cov-report=xml --cov-report=json
        python dev/check_coverage.py coverage.json

    - name: Upload coverage
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: coverage.xml
        fail_ci_if_error: false

  distribution:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install archive tools
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full zip gzip xz-utils bzip2 zstd brotli qpdf

    - name: Install build frontend
      run: python -m pip install 'build>=1.2'

    - name: Validate source and installed artifacts outside the checkout
      run: python dev/validate_distribution.py

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check filerepack test dev/validate_distribution.py dev/check_coverage.py dev/check_spec_ownership.py
        python dev/check_spec_ownership.py

    - name: Type check with mypy
      run: |
        mypy filerepack test dev/validate_distribution.py --ignore-missing-imports

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: docs/package-lock.json

    - name: Install documentation dependencies
      working-directory: ./docs
      run: npm ci

    - name: Build documentation site
      working-directory: ./docs
      run: npm run build

  ole-native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.13']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: '1.93.1'
    - name: Build pinned native writer
      run: cargo install --locked --path tools/ole-compactor
    - name: Install OLE test dependencies
      run: python -m pip install -e ".[dev,ole-recompress]"
    - name: Require native writer and run qualification tests
      run: |
        filerepack-ole --version
        filerepack-ole --capabilities
        python -m pytest -q test/test_ole.py test/test_ole_protection.py test/test_ole_ppt.py test/test_ole_ppt_notes.py test/test_ole_ppt_roundtrip.py test/test_ole_ppt_animation.py test/test_cfb_names.py test/test_ole_recompress.py test/test_ole_diagnostics.py test/test_ole_officeart.py test/test_ole_raster.py test/test_ole_png_refilter.py test/test_ole_extended.py test/test_ole_host_coverage.py test/test_ole_hwp_codecs.py

  scientific-native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.12']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install native readers and HDF5 writer (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y r-base hdf5-tools libtiff-tools
    - name: Install native readers and HDF5 writer (macOS)
      if: runner.os == 'macOS'
      run: brew install r hdf5 libtiff
    - name: Install preserving format dependencies
      run: python -m pip install -e ".[dev,scientific,zarr]" scipy pandas pyreadstat
    - name: Install the gated Torch reader
      if: matrix.python-version == '3.12'
      run: python -m pip install torch==2.14.1
    - name: Run native scientific fixture gates
      run: python -m pytest -q test/test_scientific_formats.py

  platform-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.13']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install archive tools (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y p7zip-full zip
    - name: Install archive tools (macOS)
      if: runner.os == 'macOS'
      run: brew install sevenzip
    - name: Install archive tools (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install 7zip --yes --no-progress
        'C:\Program Files\7-Zip' | Out-File -FilePath $env:GITHUB_PATH -Append
    - name: Install dependencies
      run: python -m pip install -e ".[dev,progress]"
    - name: Require provisioned dependencies
      run: python -c "import psutil, rich, PIL, pikepdf; from filerepack.tools import resolve_szip; assert resolve_szip()"
    - name: Run process and filesystem contracts
      run: >-
        python -m pytest -q test/test_transactions.py test/test_candidate_evidence.py test/test_output_safety.py
        test/test_outcomes.py test/test_bulk_lifecycle.py test/test_reports_resume.py
        test/test_operation_budgets.py test/test_planning.py test/test_member_selection.py

  optional-integrations:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install native encoders and independent readers
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full zip ffmpeg qpdf poppler-utils \
          jpegoptim libjpeg-turbo-progs optipng pigz librsvg2-bin libopenjp2-tools
    - name: Install all optional integration families
      run: python -m pip install -e ".[dev,data,fonts,media,pdf,progress,tracev3]"
    - name: Require provisioned Python and tool backends
      run: |
        python -c "import pyarrow, fastavro, fontTools, brotli, mutagen, rich, pikepdf, PIL, lz4"
        python -c "from filerepack.tools import resolve_tool; assert all(resolve_tool(k) for k in ('ffmpeg', 'ffprobe', 'qpdf', 'jpegoptim', 'jpegtran', 'optipng', 'pigz'))"
        opj_dump -h
    - name: Run native preservation and diagnostic contracts
      run: >-
        python -m pytest -q test/test_data_preservation.py test/test_parquet_preservation.py
        test/test_fonts_preservation.py test/test_media_preservation.py
        test/test_image_presentation.py test/test_pdf_validation.py test/test_pdf_walking.py
        test/test_tracev3.py test/test_progress.py test/test_capability_registry.py
