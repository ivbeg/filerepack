name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system tools
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full zip jpegoptim pngquant optipng gzip xz-utils bzip2 zstd brotli qpdf

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        pytest --cov=filerepack --cov-report=xml

    - name: Upload coverage
      if: matrix.python-version == '3.12'
      uses: actions/codecov-action@v4
      with:
        file: coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check filerepack test

    - name: Type check with mypy
      run: |
        mypy filerepack test --ignore-missing-imports
