[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filerepack"
dynamic = ["version"]
description = "Repacks existing (un)compressed files for higher compression"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "BSD"}
authors = [
    {name = "Ivan Begtin", email = "ivan@begtin.tech"},
]
requires-python = ">=3.9"
keywords = ["files", "converter", "compression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "typer>=0.9.0",
]

[project.optional-dependencies]
data = [
    "duckdb>=0.9.0",
    "pyarrow>=14.0",
    "fastavro>=1.9",
]
fonts = ["fonttools[woff]>=4.40"]
parquet = ["duckdb>=0.9.0"]
progress = ["rich>=13.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "mypy>=1.0",
]

[project.scripts]
filerepack = "filerepack.__main__:main"

[project.urls]
Homepage = "https://github.com/ivbeg/filerepack"

[tool.setuptools.dynamic]
version = {attr = "filerepack.__version__"}

[tool.setuptools.packages.find]
include = ["filerepack*"]
exclude = ["test*"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytest", "_pytest.*", "typer.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["filerepack.codecs"]
warn_return_any = false

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["filerepack", "test"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15
